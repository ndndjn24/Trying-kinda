<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    
    .box {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    
    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }
    
    .online { color: #0f0; }
    .offline { color: #f00; }
    .ready { color: #00e5ff; }
    
    h1 {
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    
    input {
      width: 100%;
      padding: 20px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      color: white;
      font-size: 17px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      box-sizing: border-box;
    }
    
    input:focus {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.2);
    }
    
    button {
      width: 100%;
      padding: 18px;
      background: white;
      color: black;
      border: none;
      border-radius: 15px;
      font-weight: bold;
      font-size: 15px;
      margin: 10px 0;
      cursor: pointer;
    }
    
    button:active {
      opacity: 0.9;
      transform: scale(0.98);
    }
    
    #output {
      font-size: 24px;
      margin: 20px 0;
      min-height: 40px;
      word-break: break-all;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
    }
    
    .copy-btn {
      background: #222;
      color: #999;
      display: none;
    }
    
    .info {
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="status" class="status">● LOADING</div>
    <h1>FH DECODER</h1>
    
    <input type="text" id="input" placeholder="WIFI NAME" autocomplete="off">
    
    <button onclick="convert()">CONVERT</button>
    
    <div id="output"></div>
    
    <button id="copyBtn" class="copy-btn" onclick="copyText()">COPY</button>
    
    <div class="info">OFFLINE MODE | iOS 26</div>
  </div>

  <script>
    // الخوارزمية
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    function convert() {
      const input = document.getElementById('input').value.trim().toLowerCase();
      const output = document.getElementById('output');
      const copyBtn = document.getElementById('copyBtn');
      
      if (!input) return;
      
      let result = "";
      let text = input;
      
      if (text.startsWith("fh_")) {
        result = "wlan";
        text = text.substring(3);
      }
      
      for (let char of text) {
        result += map[char] || char;
      }
      
      output.textContent = result;
      copyBtn.style.display = 'block';
      localStorage.setItem('last', result);
    }

    function copyText() {
      const text = document.getElementById('output').textContent;
      const btn = document.getElementById('copyBtn');
      
      navigator.clipboard.writeText(text);
      btn.textContent = "✓ COPIED";
      setTimeout(() => {
        btn.textContent = "COPY";
        btn.style.display = 'none';
      }, 1500);
    }

    // إدارة حالة الاتصال ورفع كفاءة العمل أوفلاين
    window.addEventListener('load', () => {
      const status = document.getElementById('status');
      
      function updateStatus() {
        if (!navigator.onLine) {
          status.textContent = "● OFFLINE";
          status.className = "status offline";
        } else {
          status.textContent = "● ONLINE / READY";
          status.className = "status ready";
        }
      }
      
      updateStatus();
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
      
      document.getElementById('input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') convert();
      });

      // تسجيل Service Worker مدمج تلقائياً بدون الحاجة لملفات إضافية
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'fh-decoder-v1';
          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll([location.href]))
            );
            self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).then(() => {
          if (navigator.onLine) {
            status.textContent = "● OFFLINE READY";
            status.className = "status ready";
          }
        }).catch(() => {
          // في حال تم فتح الملف مستقبلاً عبر HTTPS ستتفعل الميزة فوراً
        });
      }
    });
  </script>
</body>
</html>
