<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FH DECODER v3 - OFFLINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }
        
        /* Glass effect container */
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        /* Status indicator - SIMPLE */
        .status {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 600;
            color: #666;
            transition: all 0.5s ease;
        }
        
        .status.ready {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        /* Title */
        .title {
            font-weight: 300;
            font-size: 24px;
            letter-spacing: 6px;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.95);
            text-transform: uppercase;
        }
        
        /* Input field */
        .input-field {
            width: 100%;
            padding: 22px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: white;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }
        
        .input-field:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
            outline: none;
        }
        
        .btn-primary {
            background: white;
            color: black;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
            background: #e0e0e0;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            display: none;
        }
        
        .btn-secondary:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Output */
        .output {
            margin-top: 40px;
            font-size: 32px;
            font-weight: 300;
            min-height: 50px;
            word-break: break-all;
            color: white;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Info box */
        .info {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 30px;
            line-height: 1.5;
        }
        
        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
        }
        
        /* Examples */
        .examples {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .example-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .example-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* Vibration effect */
        @keyframes vibrate {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
            100% { transform: translateX(0); }
        }
        
        .vibrate {
            animation: vibrate 0.1s linear 3;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .glass-container {
                padding: 30px 20px;
                border-radius: 25px;
            }
            
            .title {
                font-size: 20px;
                letter-spacing: 4px;
                margin-bottom: 30px;
            }
            
            .input-field {
                padding: 18px;
                font-size: 16px;
            }
            
            .btn {
                padding: 18px;
            }
            
            .output {
                font-size: 26px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <!-- Status Indicator - SIMPLE -->
        <div id="statusIndicator" class="status">● WAITING...</div>
        
        <!-- Title -->
        <h1 class="title">FH DECODER</h1>
        
        <!-- Input Field -->
        <input 
            type="text" 
            id="inputField" 
            class="input-field" 
            placeholder="Enter WiFi Name" 
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
        >
        
        <!-- Example Buttons -->
        <div class="examples">
            <div class="example-btn" onclick="insertExample('fh_12345')">fh_12345</div>
            <div class="example-btn" onclick="insertExample('fh_abcde')">fh_abcde</div>
            <div class="example-btn" onclick="insertExample('test')">test</div>
        </div>
        
        <!-- Convert Button -->
        <button id="convertBtn" class="btn btn-primary" onclick="convert()">
            CONVERT
        </button>
        
        <!-- Output -->
        <div id="output" class="output"></div>
        
        <!-- Copy Button -->
        <button id="copyBtn" class="btn btn-secondary" onclick="copyResult()">
            TAP TO COPY
        </button>
        
        <!-- Info -->
        <div class="info">
            Enter any FH WiFi name to decode it instantly.<br>
            Works 100% offline after first visit.
        </div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
        YOUCEF DJEBBAR | v3 OFFLINE
    </div>

    <script>
        // الفهرسة الخاصة بفك التشفير
        const decodeMap = {
            "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
            "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
            "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
            "s":"n","t":"m","u":"l","f":"0",
            "z":"g","y":"h","x":"i","w":"j","v":"k",
            "e":"1","d":"2","c":"3","b":"4","a":"5",
            "9":"6","8":"7","7":"8","6":"9"
        };

        // إضافة أمثلة
        function insertExample(text) {
            const input = document.getElementById('inputField');
            input.value = text;
            input.focus();
            vibrateElement(input);
        }

        // اهتزاز العناصر
        function vibrateElement(element) {
            element.classList.add('vibrate');
            setTimeout(() => element.classList.remove('vibrate'), 300);
            
            // اهتزاز الهاتف إذا متاح
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        // دالة التحويل الرئيسية
        function convert() {
            const inputField = document.getElementById('inputField');
            const input = inputField.value.trim().toLowerCase();
            const output = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');
            const convertBtn = document.getElementById('convertBtn');
            
            if (!input) {
                output.textContent = "Please enter text";
                output.style.color = "#ff5555";
                vibrateElement(inputField);
                return;
            }
            
            // تحويل النص
            let result = "";
            let remaining = input;
            
            if (input.startsWith("fh_")) {
                result = "wlan";
                remaining = input.substring(3);
            }
            
            for (let char of remaining) {
                result += decodeMap[char] || char;
            }
            
            // عرض النتيجة
            output.textContent = result;
            output.style.color = "#ffffff";
            
            // إظهار زر النسخ
            copyBtn.style.display = "block";
            
            // تأثير النجاح
            vibrateElement(convertBtn);
            output.classList.add('vibrate');
            setTimeout(() => output.classList.remove('vibrate'), 300);
            
            // حفظ آخر إدخال
            localStorage.setItem('lastInput', input);
            localStorage.setItem('lastOutput', result);
        }

        // نسخ النتيجة
        function copyResult() {
            const text = document.getElementById('output').textContent;
            const copyBtn = document.getElementById('copyBtn');
            
            if (!text || text === "Please enter text") return;
            
            navigator.clipboard.writeText(text)
                .then(() => {
                    // تغيير الزر للإشارة للنسخ
                    copyBtn.textContent = "✓ COPIED!";
                    copyBtn.style.background = "rgba(0, 255, 136, 0.2)";
                    copyBtn.style.color = "#00ff88";
                    
                    // اهتزاز
                    vibrateElement(copyBtn);
                    
                    // العودة للحالة الأصلية بعد 2 ثانية
                    setTimeout(() => {
                        copyBtn.textContent = "TAP TO COPY";
                        copyBtn.style.background = "rgba(255, 255, 255, 0.1)";
                        copyBtn.style.color = "#aaa";
                    }, 2000);
                })
                .catch(err => {
                    console.error('Copy failed:', err);
                    copyBtn.textContent = "Copy Failed";
                    copyBtn.style.color = "#ff5555";
                });
        }

        // ===== OFFLINE FUNCTIONALITY =====
        
        // تسجيل Service Worker
        function setupOfflineMode() {
            const status = document.getElementById('statusIndicator');
            
            // تحقق من دعم Service Worker
            if (!('serviceWorker' in navigator)) {
                status.textContent = "● ONLINE ONLY";
                status.style.color = "#ffaa00";
                return;
            }
            
            // تسجيل Service Worker
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('✅ Service Worker registered');
                    
                    // تحديث الواجهة
                    status.textContent = "● OFFLINE READY";
                    status.classList.add('ready');
                    
                    // تحقق من التخزين المؤقت
                    checkCache();
                    
                    // استعادة آخر إدخال
                    restoreLastInput();
                })
                .catch(error => {
                    console.error('Service Worker failed:', error);
                    status.textContent = "● ONLINE MODE";
                    status.style.color = "#ffaa00";
                });
        }
        
        // تحقق من التخزين المؤقت
        function checkCache() {
            if ('caches' in window) {
                caches.has('fh-decoder-cache')
                    .then(hasCache => {
                        if (hasCache) {
                            console.log('💾 Site is cached for offline use');
                        }
                    });
            }
        }
        
        // استعادة آخر إدخال
        function restoreLastInput() {
            const lastInput = localStorage.getItem('lastInput');
            if (lastInput) {
                document.getElementById('inputField').value = lastInput;
            }
        }
        
        // التحقق من حالة الاتصال
        function updateConnectionStatus() {
            const status = document.getElementById('statusIndicator');
            
            if (!navigator.onLine) {
                // إذا كنا أوفلاين والموقع جاهز
                if (status.classList.contains('ready')) {
                    status.textContent = "● WORKING OFFLINE";
                    status.style.color = "#00ff88";
                } else {
                    status.textContent = "● NO INTERNET";
                    status.style.color = "#ff5555";
                }
            }
        }
        
        // ===== INITIALIZATION =====
        
        // عند تحميل الصفحة
        window.addEventListener('load', () => {
            // إعداد وضع الأوفلاين
            setupOfflineMode();
            
            // تحديث حالة الاتصال
            updateConnectionStatus();
            
            // مراقبة تغييرات الاتصال
            window.addEventListener('online', updateConnectionStatus);
            window.addEventListener('offline', updateConnectionStatus);
            
            // تفعيل الإدخال عند الضغط على Enter
            document.getElementById('inputField').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    convert();
                }
            });
            
            // تحميل تلقائي بعد 3 ثوان إذا كان هناك إدخال سابق
            setTimeout(() => {
                const savedInput = localStorage.getItem('lastInput');
                if (savedInput) {
                    document.getElementById('inputField').focus();
                }
            }, 3000);
        });
        
        // اختبار نهائي بعد 5 ثوان
        setTimeout(() => {
            if (!document.getElementById('statusIndicator').classList.contains('ready')) {
                console.log('Offline mode still loading...');
            }
        }, 5000);
    </script>
</body>
</html>
