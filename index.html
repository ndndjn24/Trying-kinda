<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER v3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 50, 50, 0.2);
      --bg-dark: #030303;
      --accent-red: #ff2a2a;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .liquid-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #1a0505 0%, #030303 100%);
      z-index: -1;
    }

    .container {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border: 1px solid var(--border);
      padding: 45s px 30px;
      padding-top: 50px;
      padding-bottom: 50px;
      border-radius: 40px;
      width: 85%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 20px rgba(255,0,0,0.05);
      position: relative;
    }

    h2 {
      font-weight: 300;
      letter-spacing: 6px;
      margin-bottom: 30px;
      color: rgba(255,255,255,0.95);
      font-size: 22px;
    }

    /* مؤشر حالة الأوفلاين */
    .status-indicator {
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 9px;
      letter-spacing: 1px;
      color: #666;
      font-weight: bold;
    }
    
    .ready { color: var(--accent-red); text-shadow: 0 0 10px rgba(255,42,42,0.4); }

    .input-group {
      position: relative;
      width: 100%;
      box-sizing: border-box;
    }

    input {
      width: 100%;
      padding: 18px 45px 18px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
      text-align: center;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      background: rgba(255,255,255,0.06);
      border-color: var(--accent-red);
      box-shadow: 0 0 15px rgba(255,42,42,0.15);
    }

    /* زر المسح السريع داخل حقل الإدخال */
    .clear-input {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      cursor: pointer;
      display: none;
      padding: 5px;
    }

    .clear-input:hover {
      color: white;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .convert-btn {
      margin-top: 25px;
      background: var(--accent-red);
      color: white;
      box-shadow: 0 10px 25px rgba(255,42,42,0.3);
    }

    .convert-btn:active {
      transform: scale(0.96);
      background: #e02020;
    }

    .copy-btn {
      margin-top: 15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #aaa;
      display: none;
    }

    .copy-btn:active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.1);
    }

    #output {
      margin-top: 30px;
      font-size: 28px;
      font-weight: 200;
      color: #ffffff;
      min-height: 35px;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .watermark {
      position: fixed;
      bottom: 25px;
      font-size: 9px;
      color: rgba(255,255,255,0.25);
      text-decoration: none;
      letter-spacing: 2px;
      transition: color 0.3s;
    }

    .watermark:hover {
      color: var(--accent-red);
    }
  </style>
</head>
<body>

  <div class="liquid-bg"></div>

  <div class="container">
    <div id="statusText" class="status-indicator">LOADING v3...</div>
    
    <h2>FH DECODER</h2>
    
    <div class="input-group">
      <input id="input" type="text" placeholder="WIFI NAME" autocomplete="off" oninput="toggleClearBtn()">
      <button id="clearBtn" class="clear-input" onclick="clearInput()">✕</button>
    </div>
    
    <button class="action-btn convert-btn" onclick="run()">CONVERT</button>

    <div id="output"></div>
    
    <button id="copyBtn" class="action-btn copy-btn" onclick="copyToClipboard()">TAP TO COPY</button>
  </div>

  <a href="https://www.instagram.com/alt.yxf" target="_blank" class="watermark">
    YOUCEF DJEBBAR | IG: alt.yxf
  </a>

  <script>
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    function run() {
      let inputField = document.getElementById("input");
      let inputVal = inputField.value.trim().toLowerCase();
      const output = document.getElementById("output");
      const copyBtn = document.getElementById("copyBtn");

      if (inputVal === "") return;

      let result = "";
      let remainingText = inputVal;

      if (inputVal.startsWith("fh_")) {
        result = "wlan";
        remainingText = inputVal.substring(3);
      }

      for (let ch of remainingText) {
        result += map[ch] ?? ch;
      }

      output.textContent = result;
      copyBtn.style.display = "block";
    }

    function toggleClearBtn() {
      const val = document.getElementById("input").value;
      const clearBtn = document.getElementById("clearBtn");
      clearBtn.style.display = val.length > 0 ? "block" : "none";
    }

    function clearInput() {
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "";
      document.getElementById("copyBtn").style.display = "none";
      document.getElementById("clearBtn").style.display = "none";
      document.getElementById("input").focus();
    }

    function copyToClipboard() {
      const text = document.getElementById("output").textContent;
      const btn = document.getElementById("copyBtn");
      
      if (navigator.vibrate) navigator.vibrate(40);
      
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "COPIED ✅";
        btn.style.color = "white";
        btn.style.borderColor = "var(--accent-red)";
        setTimeout(() => { 
          btn.textContent = "TAP TO COPY"; 
          btn.style.color = "#aaa";
          btn.style.borderColor = "rgba(255,255,255,0.1)";
        }, 2000);
      });
    }

    // --- نظام الأوفلاين v3 ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          self.addEventListener('install', e => {
            self.skipWaiting();
            e.waitUntil(caches.open('fh-v3').then(c => c.add(new Request(self.location.href, {cache: 'reload'}))));
          });
          self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request)
                .then(res => {
                  const resClone = res.clone();
                  caches.open('fh-v3').then(c => c.put(e.request, resClone));
                  return res;
                })
                .catch(() => caches.match(e.request))
            );
          });
        `], {type: 'text/javascript'});

        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).then(() => {
          const status = document.getElementById('statusText');
          status.textContent = "● OFFLINE READY (v3)";
          status.classList.add('ready');
        }).catch(err => console.log('SW error', err));
      });
    }
  </script>
</body>
</html>
