<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER v3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #0a0a0a;
      --border-light: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #666666;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .main-wrapper {
      width: 85%;
      max-width: 340px;
      text-align: center;
      position: relative;
    }

    h2 {
      font-weight: 200;
      letter-spacing: 8px;
      margin-bottom: 40px;
      color: var(--text-main);
      font-size: 20px;
      text-transform: uppercase;
    }

    /* خانة الكتابة */
    .input-group {
      position: relative;
      width: 100%;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 18px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 1px;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: #111111;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* زر التحويل أبيض وأسود */
    .convert-btn {
      background: #ffffff;
      color: #000000;
    }

    .convert-btn:active {
      transform: scale(0.97);
      background: #dddddd;
    }

    #output {
      margin-top: 35px;
      font-size: 26px;
      font-weight: 200;
      color: var(--text-main);
      min-height: 35px;
      letter-spacing: 2px;
      word-break: break-all;
    }

    /* زرا Clear و Copy متجاوران */
    .bottom-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      display: none;
    }

    .sub-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border-light);
      background: var(--card-bg);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s ease;
    }

    .sub-btn:active {
      transform: scale(0.97);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      background: #161616;
    }

    /* العلامة المائية في الأسفل */
    .watermark {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.2);
      text-decoration: none;
      letter-spacing: 2px;
      transition: color 0.3s;
    }

    .watermark:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <h2>FH DECODER</h2>
    
    <div class="input-group">
      <input id="input" type="text" placeholder="WIFI NAME" autocomplete="off">
    </div>
    
    <button class="action-btn convert-btn" onclick="run()">CONVERT</button>

    <div id="output"></div>
    
    <div id="bottomActions" class="bottom-actions">
      <button class="sub-btn" onclick="clearAll()">CLEAR</button>
      <button id="copyBtn" class="sub-btn" onclick="copyToClipboard()">COPY</button>
    </div>
  </div>

  <a href="https://www.instagram.com/alt.yxf" target="_blank" class="watermark">
    YOUCEF DJEBBAR | IG: alt.yxf
  </a>

  <script>
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    function run() {
      let inputVal = document.getElementById("input").value.trim().toLowerCase();
      const output = document.getElementById("output");
      const bottomActions = document.getElementById("bottomActions");

      if (inputVal === "") return;

      let result = "";
      let remainingText = inputVal;

      if (inputVal.startsWith("fh_")) {
        result = "wlan";
        remainingText = inputVal.substring(3);
      }

      for (let ch of remainingText) {
        result += map[ch] ?? ch;
      }

      output.textContent = result;
      bottomActions.style.display = "flex";
    }

    function clearAll() {
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "";
      document.getElementById("bottomActions").style.display = "none";
      document.getElementById("input").focus();
    }

    function copyToClipboard() {
      const text = document.getElementById("output").textContent;
      const btn = document.getElementById("copyBtn");
      
      if (navigator.vibrate) navigator.vibrate(30);
      
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "COPIED";
        btn.style.color = "#ffffff";
        setTimeout(() => { 
          btn.textContent = "COPY"; 
          btn.style.color = "var(--text-muted)";
        }, 1800);
      });
    }

    // --- نظام الأوفلاين الشغّال في الخلفية تلقائياً ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          self.addEventListener('install', e => {
            self.skipWaiting();
            e.waitUntil(caches.open('fh-bw-v3').then(c => c.add(new Request(self.location.href, {cache: 'reload'}))));
          });
          self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request)
                .then(res => {
                  const resClone = res.clone();
                  caches.open('fh-bw-v3').then(c => c.put(e.request, resClone));
                  return res;
                })
                .catch(() => caches.match(e.request))
            );
          });
        `], {type: 'text/javascript'});

        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
      });
    }
  </script>
</body>
</html>
