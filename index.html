<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER v3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050505">
  
  <!-- Manifest الجديد -->
  <link rel="manifest" href="manifest.json">

  <style>
    /* نفس الـ CSS الخاص بك تماماً */
    :root {
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
      --bg-dark: #050505;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .liquid-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
      z-index: -1;
    }

    .container {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border: 1px solid var(--border);
      padding: 50px 30px;
      border-radius: 40px;
      width: 85%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      position: relative;
    }

    h2 {
      font-weight: 200;
      letter-spacing: 5px;
      margin-bottom: 40px;
      color: rgba(255,255,255,0.9);
      font-size: 20px;
    }

    /* مؤشر حالة الأوفلاين - محسن */
    .status-indicator {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 1px;
      color: #555;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .ready { 
      color: #00ff88; 
      text-shadow: 0 0 10px rgba(0,255,136,0.3);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    input {
      width: 100%;
      padding: 20px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: white;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
      box-sizing: border-box;
      text-align: center;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.3);
    }

    .action-btn {
      width: 100%;
      padding: 18px;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .convert-btn {
      margin-top: 30px;
      background: #ffffff;
      color: #000;
    }

    .convert-btn:active {
      transform: scale(0.96);
      background: #cccccc;
    }

    .copy-btn {
      margin-top: 15px;
      background: #252525;
      color: #999;
      display: none;
    }

    .copy-btn:active {
      transform: scale(0.96);
      background: #333;
    }

    #output {
      margin-top: 40px;
      font-size: 30px;
      font-weight: 200;
      color: #ffffff;
      min-height: 40px;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .watermark {
      position: fixed;
      bottom: 30px;
      font-size: 9px;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="liquid-bg"></div>

  <div class="container">
    <!-- مؤشر الحالة مع ثلاث حالات -->
    <div id="statusText" class="status-indicator">
      <span id="onlineStatus">● ONLINE</span> | 
      <span id="offlineReady">WAITING...</span>
    </div>
    
    <h2>FH DECODER</h2>
    <input id="input" type="text" placeholder="WIFI NAME" autocomplete="off">
    
    <button class="action-btn convert-btn" onclick="run()">CONVERT</button>

    <div id="output"></div>
    
    <button id="copyBtn" class="action-btn copy-btn" onclick="copyToClipboard()">TAP TO COPY</button>
  </div>

  <a href="https://www.instagram.com/alt.yxf" target="_blank" class="watermark">
    YOUCEF DJEBBAR | v3 - OFFLINE READY
  </a>

  <script>
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    function run() {
      let inputField = document.getElementById("input");
      let inputVal = inputField.value.trim().toLowerCase();
      const output = document.getElementById("output");
      const copyBtn = document.getElementById("copyBtn");

      if (inputVal === "") return;

      let result = "";
      let remainingText = inputVal;

      if (inputVal.startsWith("fh_")) {
        result = "wlan";
        remainingText = inputVal.substring(3);
      }

      for (let ch of remainingText) {
        result += map[ch] ?? ch;
      }

      output.textContent = result;
      copyBtn.style.display = "block";
    }

    function copyToClipboard() {
      const text = document.getElementById("output").textContent;
      const btn = document.getElementById("copyBtn");
      
      if (navigator.vibrate) navigator.vibrate(40);
      
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "COPIED ✅";
        btn.style.color = "white";
        setTimeout(() => { 
          btn.textContent = "TAP TO COPY"; 
          btn.style.color = "#999";
        }, 2000);
      });
    }

    // ============ إدارة الحالة الأوفلاين ============
    
    // تحديث حالة الاتصال
    function updateConnectionStatus() {
      const onlineStatus = document.getElementById('onlineStatus');
      const offlineReady = document.getElementById('offlineReady');
      
      if (navigator.onLine) {
        onlineStatus.textContent = "● ONLINE";
        onlineStatus.style.color = "#00ff88";
      } else {
        onlineStatus.textContent = "● OFFLINE";
        onlineStatus.style.color = "#ff5555";
      }
    }
    
    // تسجيل Service Worker
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('✅ FH Decoder: Service Worker registered!');
            
            // تحديث حالة الأوفلاين
            const offlineReady = document.getElementById('offlineReady');
            offlineReady.textContent = "OFFLINE READY";
            offlineReady.style.color = "#00ff88";
            offlineReady.classList.add('ready');
            
            // التأكد من أن SW نشط
            if (registration.active) {
              console.log('🚀 Service Worker is active and controlling the page');
            }
          })
          .catch(error => {
            console.error('❌ Service Worker registration failed:', error);
            document.getElementById('offlineReady').textContent = "OFFLINE FAILED";
            document.getElementById('offlineReady').style.color = "#ff5555";
          });
      } else {
        document.getElementById('offlineReady').textContent = "NO SW SUPPORT";
        document.getElementById('offlineReady').style.color = "#ffaa00";
      }
    }
    
    // عند تحميل الصفحة
    window.addEventListener('load', () => {
      // تحديث حالة الاتصال أولاً
      updateConnectionStatus();
      
      // تسجيل Service Worker
      registerServiceWorker();
      
      // مراقبة تغيرات الاتصال
      window.addEventListener('online', updateConnectionStatus);
      window.addEventListener('offline', updateConnectionStatus);
      
      // اختبار الكاش
      setTimeout(() => {
        if ('caches' in window) {
          caches.open('fh-decoder-v3').then(cache => {
            cache.keys().then(keys => {
              if (keys.length > 0) {
                console.log(`✅ ${keys.length} files cached for offline use`);
              }
            });
          });
        }
      }, 2000);
    });
  </script>
</body>
</html>
