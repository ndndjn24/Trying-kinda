<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #0d0d0d;
      --border-light: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #666666;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .bg-gradient {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #0d0d0d 0%, #000000 80%);
      z-index: -1;
    }

    .main-wrapper {
      width: 85%;
      max-width: 340px;
      text-align: center;
      position: relative;
    }

    .input-group {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }

    /* حقل إدخال حر ومباشر بدون أي قيود تمنع ظهور الكيبورد */
    input {
      width: 100%;
      padding: 18px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      text-align: center;
      letter-spacing: 1px;
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.6);
      background: #141414;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .action-btn {
      width: 100%;
      padding: 17px;
      border-radius: 18px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
    }

    .convert-btn {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }

    .convert-btn:active {
      transform: scale(0.96);
      background: #e0e0e0;
    }

    #output {
      margin-top: 35px;
      font-size: 28px;
      font-weight: 200;
      color: var(--text-main);
      min-height: 40px;
      letter-spacing: 2px;
      word-break: break-all;
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .bottom-actions.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .sub-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border-light);
      background: var(--card-bg);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      outline: none;
    }

    .sub-btn:active {
      transform: scale(0.96);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      background: #181818;
    }

    .watermark {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.2);
      text-decoration: none;
      letter-spacing: 2px;
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>

  <div class="main-wrapper">
    <div class="input-group">
      <input id="input" type="text" placeholder="WIFI NAME" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="autoConvertIfPasted()">
    </div>
    
    <button class="action-btn convert-btn" onclick="run()">CONVERT</button>

    <div id="output"></div>
    
    <div id="bottomActions" class="bottom-actions">
      <button class="sub-btn" onclick="clearAll()">CLEAR</button>
      <button id="copyBtn" class="sub-btn" onclick="copyToClipboard()">COPY</button>
    </div>
  </div>

  <a href="https://www.instagram.com/alt.yxf" target="_blank" class="watermark">
    IG: alt.yxf
  </a>

  <script>
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    window.addEventListener('DOMContentLoaded', () => {
      clearAll();
    });

    function run() {
      let inputVal = document.getElementById("input").value.trim().toLowerCase();
      const output = document.getElementById("output");
      const bottomActions = document.getElementById("bottomActions");

      if (inputVal === "") return;
      if (navigator.vibrate) navigator.vibrate(25);

      let result = "";
      let remainingText = inputVal;

      if (inputVal.startsWith("fh_")) {
        result = "wlan";
        remainingText = inputVal.substring(3);
      }

      for (let ch of remainingText) {
        result += map[ch] ?? ch;
      }

      output.textContent = result;
      bottomActions.classList.add("visible");
    }

    function autoConvertIfPasted() {
      const val = document.getElementById("input").value;
      if (val.length >= 8 && (val.startsWith("fh_") || val.startsWith("FH_"))) {
        run();
      }
    }

    function clearAll() {
      if (navigator.vibrate) navigator.vibrate(15);
      const inputEl = document.getElementById("input");
      inputEl.value = "";
      document.getElementById("output").textContent = "";
      document.getElementById("bottomActions").classList.remove("visible");
    }

    function copyToClipboard() {
      const text = document.getElementById("output").textContent;
      const btn = document.getElementById("copyBtn");
      
      if (!text) return;
      if (navigator.vibrate) navigator.vibrate(40);
      
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "COPIED";
        btn.style.color = "#ffffff";
        setTimeout(() => { 
          btn.textContent = "COPY"; 
          btn.style.color = "var(--text-muted)";
        }, 1800);
      });
    }

    // --- نظام الأوفلاين الآمن والمستقر (v6) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
          self.addEventListener('install', e => {
            self.skipWaiting();
            e.waitUntil(caches.open('fh-v6').then(c => c.add(new Request(self.location.href, {cache: 'reload'}))));
          });
          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys().then(keys => Promise.all(keys.map(k => k !== 'fh-v6' ? caches.delete(k) : null)))
              .then(() => self.clients.claim())
            );
          });
          self.addEventListener('fetch', e => {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `)).catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
