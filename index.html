<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FH DECODER">
  <meta name="theme-color" content="#000000">

  <!-- Manifest مدمج تلقائياً لتثبيت التطبيق على الشاشة الرئيسية بدون ملفات إضافية -->
  <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkZIREVDT0RFUiIsCiAgInNob3J0X25hbWUiOiAiRkhERUNPREVSIiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDAwMDAwIiwKICAidGhlbWVfY29sb3IiOiAiIzAwMDAwMCIKZX0=">

  <style>
    :root {
      --accent-color: #ff2a2a;
      --accent-glow: rgba(255, 42, 42, 0.4);
      --bg-gradient: radial-gradient(circle at center, #1a0505 0%, #000000 100%);
    }

    body {
      margin: 0;
      background: var(--bg-gradient);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    /* المربع الرئيسي مع إطار نيون متحرك حوله بالكامل */
    .box-wrapper {
      position: relative;
      width: 100%;
      border-radius: 26px;
      padding: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
    }

    /* حلقة النيون الحمراء الدوارة */
    .box-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent, 
        transparent, 
        transparent, 
        var(--accent-color)
      );
      animation: rotate-neon 4s linear infinite;
    }

    @keyframes rotate-neon {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .box {
      position: relative;
      background: #080808;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      z-index: 1;
    }
    
    .status {
      font-size: 11px;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
      font-weight: 600;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
    }
    
    h1 {
      font-weight: 300;
      letter-spacing: 4px;
      margin: 0 0 22px 0;
      font-size: 26px;
      text-shadow: 0 2px 10px rgba(255,255,255,0.1);
    }
    
    .input-group {
      position: relative;
      width: 100%;
    }

    input {
      width: 100%;
      padding: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    
    input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    
    .btn-main {
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #000;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }
    
    .btn-main:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    #output-container {
      margin-top: 15px;
      display: none;
    }
    
    /* حدود عادية بدون تقطعات وزخرفة متقطعة */
    #output {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
      word-break: break-all;
      padding: 16px;
      background: rgba(255, 42, 42, 0.05);
      border: 1px solid rgba(255, 42, 42, 0.4);
      border-radius: 14px;
      color: var(--accent-color);
      margin-bottom: 10px;
      text-shadow: 0 0 8px var(--accent-glow);
    }
    
    .action-btns {
      display: flex;
      gap: 8px;
    }

    .sub-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sub-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* زر التثبيت كـ تطبيق */
    .install-btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: transparent;
      border: 1px dashed rgba(255, 42, 42, 0.5);
      color: var(--accent-color);
      border-radius: 12px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      display: none;
      transition: all 0.3s ease;
    }

    .install-btn:hover {
      background: rgba(255, 42, 42, 0.1);
    }

    /* حساب الإنستغرام خارج المربع */
    .instagram-link {
      margin-top: 22px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      letter-spacing: 1.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .instagram-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- غلاف النيون الدوار -->
    <div class="box-wrapper">
      <div class="box">
        <div id="status" class="status">● OFFLINE READY</div>
        <h1>FH DECODER</h1>
        
        <div class="input-group">
          <input type="text" id="input" placeholder="WIFI NAME" autocomplete="off">
        </div>
        
        <button class="btn-main" onclick="convert()">CONVERT</button>
        
        <div id="output-container">
          <div id="output"></div>
          <div class="action-btns">
            <button id="copyBtn" class="sub-btn" onclick="copyText()">COPY</button>
            <button class="sub-btn" onclick="clearAll()">CLEAR</button>
          </div>
        </div>

        <!-- زر التثبيت والتنزيل كـ تطبيق -->
        <button id="installBtn" class="install-btn" onclick="installApp()">📲 ADD TO HOME SCREEN</button>
      </div>
    </div>

    <!-- يوزر الإنستغرام خارج المربع -->
    <a href="https://instagram.com/alt.yxf" target="_blank" class="instagram-link" onclick="triggerHaptic()">
      <span>IG:</span> @alt.yxf
    </a>
  </div>

  <script>
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    // دالة الاهتزاز اللمسي (Haptic Feedback)
    function triggerHaptic() {
      if ('vibrate' in navigator) {
        navigator.vibrate(12); // اهتزاز خفيف بالمللي ثانية
      }
    }

    function convert() {
      triggerHaptic();
      const input = document.getElementById('input').value.trim().toLowerCase();
      const output = document.getElementById('output');
      const outputContainer = document.getElementById('output-container');
      
      if (!input) return;
      
      let result = "";
      let text = input;
      
      if (text.startsWith("fh_")) {
        result = "wlan";
        text = text.substring(3);
      }
      
      for (let char of text) {
        result += map[char] || char;
      }
      
      output.textContent = result;
      outputContainer.style.display = 'block';
      localStorage.setItem('last', result);
    }

    function copyText() {
      triggerHaptic();
      const text = document.getElementById('output').textContent;
      const btn = document.getElementById('copyBtn');
      
      navigator.clipboard.writeText(text);
      btn.textContent = "✓ COPIED";
      setTimeout(() => {
        btn.textContent = "COPY";
      }, 1500);
    }

    function clearAll() {
      triggerHaptic();
      document.getElementById('input').value = '';
      document.getElementById('output').textContent = '';
      document.getElementById('output-container').style.display = 'none';
      document.getElementById('input').focus();
    }

    // إدارة تثبيت التطبيق PWA
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    function installApp() {
      triggerHaptic();
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    // إعدادات الـ Offline وحفظ الملفات
    window.addEventListener('load', () => {
      document.getElementById('input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') convert();
      });

      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'fh-decoder-v3';
          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll([location.href]))
            );
            self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      }
    });
  </script>
</body>
</html>
