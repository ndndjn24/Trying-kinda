<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FH DECODER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #0d0d0d;
      --border-light: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #666666;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* الخلفية لا تستقبل اللمس إطلاقاً */
    .bg-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #0d0d0d 0%, #000000 80%);
      z-index: 0;
      pointer-events: none;
    }

    .main-wrapper {
      width: 85%;
      max-width: 340px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .input-group { position: relative; width: 100%; margin-bottom: 20px; }

    input {
      display: block;
      width: 100%;
      padding: 18px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 18px;
      color: var(--text-main);
      font-size: 16px; /* لا تصغّره: أقل من 16 يسبب تكبير تلقائي في الآيفون */
      font-family: inherit;
      outline: none;
      text-align: center;
      letter-spacing: 1px;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
    input:focus {
      border-color: rgba(255, 255, 255, 0.6);
      background: #141414;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .action-btn {
      width: 100%;
      padding: 17px;
      border-radius: 18px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
    }
    .convert-btn { background: #ffffff; color: #000000; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }
    .convert-btn:active { transform: scale(0.96); background: #e0e0e0; }

    #output {
      margin-top: 35px;
      font-size: 28px;
      font-weight: 200;
      color: var(--text-main);
      min-height: 40px;
      letter-spacing: 2px;
      word-break: break-all;
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .bottom-actions.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .sub-btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border-light);
      background: var(--card-bg);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      outline: none;
    }
    .sub-btn:active { transform: scale(0.96); color: #fff; border-color: rgba(255,255,255,0.4); background: #181818; }

    .watermark {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.2);
      text-decoration: none;
      letter-spacing: 2px;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>

  <div class="main-wrapper">
    <div class="input-group">
      <input id="input" type="text" inputmode="text" enterkeyhint="go"
             placeholder="WIFI NAME" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false">
    </div>

    <button class="action-btn convert-btn" id="convertBtn" type="button">CONVERT</button>

    <div id="output"></div>

    <div id="bottomActions" class="bottom-actions">
      <button class="sub-btn" id="clearBtn" type="button">CLEAR</button>
      <button class="sub-btn" id="copyBtn" type="button">COPY</button>
    </div>
  </div>

  <a href="https://www.instagram.com/alt.yxf" target="_blank" rel="noopener" class="watermark">IG: alt.yxf</a>

  <script>
    const map = {
      "5":"a","4":"b","3":"c","2":"d","1":"e","0":"f",
      "g":"z","h":"y","i":"x","j":"w","k":"v","l":"u",
      "m":"t","n":"s","o":"r","p":"q","q":"p","r":"o",
      "s":"n","t":"m","u":"l","f":"0",
      "z":"g","y":"h","x":"i","w":"j","v":"k",
      "e":"1","d":"2","c":"3","b":"4","a":"5",
      "9":"6","8":"7","7":"8","6":"9"
    };

    const inputEl = document.getElementById("input");
    const output = document.getElementById("output");
    const bottomActions = document.getElementById("bottomActions");
    const copyBtn = document.getElementById("copyBtn");

    function run() {
      const inputVal = inputEl.value.trim().toLowerCase();
      if (inputVal === "") return;

      let result = "";
      let remaining = inputVal;
      if (inputVal.startsWith("fh_")) {
        result = "wlan";
        remaining = inputVal.substring(3);
      }
      for (const ch of remaining) result += (map[ch] !== undefined ? map[ch] : ch);

      output.textContent = result;
      bottomActions.classList.add("visible");
    }

    function clearAll() {
      inputEl.value = "";
      output.textContent = "";
      bottomActions.classList.remove("visible");
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px;";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    }

    function showCopied() {
      copyBtn.textContent = "COPIED";
      copyBtn.style.color = "#ffffff";
      setTimeout(() => { copyBtn.textContent = "COPY"; copyBtn.style.color = ""; }, 1800);
    }

    function copyToClipboard() {
      const text = output.textContent;
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showCopied).catch(() => { if (fallbackCopy(text)) showCopied(); });
      } else if (fallbackCopy(text)) {
        showCopied();
      }
    }

    // الأحداث
    document.getElementById("convertBtn").addEventListener("click", run);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    copyBtn.addEventListener("click", copyToClipboard);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
    inputEl.addEventListener("input", () => {
      const v = inputEl.value.toLowerCase();
      if (v.length >= 8 && v.startsWith("fh_")) run();
    });
    // اللمس في أي مكان داخل مجموعة الإدخال يفتح الكيبورد
    document.querySelector(".input-group").addEventListener("click", () => inputEl.focus());

    // الأوفلاين: يحتاج ملف sw.js حقيقي بجانب هذا الملف وعلى HTTPS
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.log("SW failed:", err));
      });
    }
  </script>
</body>
</html>
